name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Build and test jobs need read-only repository access. Container images
# stay on the runner; publishing is handled by the dedicated workflows.
permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
          working-directory: '${{ github.workspace }}/docs'
      - name: Build with Jekyll
        run: bundle exec jekyll build

  native:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build flex bison libncurses-dev libnuma-dev libssl-dev uthash-dev libcurl4-openssl-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja openssl@3 uthash
      - name: Configure
        run: cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build/native --parallel
      - name: Test Flowbench
        run: ctest --test-dir build/native -R '^flowbench/' --output-on-failure

  distro:
    name: ${{ matrix.platform.name }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-26.04
            dockerfile: ubuntu26.Dockerfile
            build_args: UBUNTU_MIRROR=azure
          - name: rocky-9
            dockerfile: rocky9.Dockerfile
            build_args: ""
          - name: rocky-10
            dockerfile: rocky10.Dockerfile
            build_args: ""
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build distro toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .github/containers
          file: .github/containers/${{ matrix.platform.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: flowbench-ci:${{ github.sha }}
          build-args: ${{ matrix.platform.build_args }}
          cache-from: type=gha,scope=flowbench-${{ matrix.platform.name }}-amd64
          # Debug and Release use the same image. Only one main-branch job
          # exports each cache, and fork PRs need no registry write access.
          cache-to: ${{ github.ref == 'refs/heads/main' && matrix.build_type == 'Release' && format('type=gha,scope=flowbench-{0}-amd64,mode=min', matrix.platform.name) || '' }}
      - name: Configure, build and test
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          mkdir -p ctest-results
          # Like libevpl CI, isolate network tests in namespaces and fail
          # configure if the runner cannot provide that isolation.
          docker run --rm --privileged \
            -e BUILD_TYPE \
            -v "${{ github.workspace }}:/workspace" -v /build -w /build \
            flowbench-ci:${{ github.sha }} bash -euxc '
              cmake -S /workspace -B . -G Ninja \
                -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DREQUIRE_NETNS_TESTS=ON
              cmake --build . --parallel 2
              ctest -R "^flowbench/" --output-on-failure --parallel 2 \
                --output-junit /workspace/ctest-results/results.xml
            '
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.platform.name }}-${{ matrix.build_type }}
          path: ctest-results/
          if-no-files-found: warn
          retention-days: 7
